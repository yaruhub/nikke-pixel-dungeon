name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, feature/rapunzel-t3-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Select APK variant
        id: variant
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "directory=debug" >> "$GITHUB_OUTPUT"
            echo "artifact=nikke-pixel-dungeon-apk" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleCloudTest" >> "$GITHUB_OUTPUT"
            echo "directory=cloudTest" >> "$GITHUB_OUTPUT"
            echo "artifact=nikke-pixel-dungeon-cloud-test-apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          BUILD_TASK: ${{ steps.variant.outputs.task }}
        run: bash ./gradlew ":android:$BUILD_TASK" --no-daemon

      - name: Verify APK signature
        env:
          APK_DIRECTORY: ${{ steps.variant.outputs.directory }}
        shell: bash
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in android/build/outputs/apk/"$APK_DIRECTORY"/*.apk; do
            "$build_tools/apksigner" verify --verbose "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact }}
          path: android/build/outputs/apk/${{ steps.variant.outputs.directory }}/*.apk
          if-no-files-found: error
