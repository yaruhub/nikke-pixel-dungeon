apply plugin: 'com.android.application'

// CLOUD_TEST_KEYSTORE is base64 content, never a path. Actions decodes it outside
// the checkout and supplies the temporary path with -PcloudTestKeystorePath.
def cloudTestSecretNames = [
    'CLOUD_TEST_KEYSTORE', 'CLOUD_TEST_STORE_PASSWORD',
    'CLOUD_TEST_KEY_ALIAS', 'CLOUD_TEST_KEY_PASSWORD'
]
def cloudTestSecrets = cloudTestSecretNames.collectEntries { name ->
    [(name): providers.environmentVariable(name).orNull]
}
def cloudTestKeystorePath = providers.gradleProperty('cloudTestKeystorePath').orNull

def validateCloudTestSigningSecrets = tasks.register('validateCloudTestSigningSecrets') {
    group = 'verification'
    description = 'Requires the fixed Cloud Test signing key; never falls back to debug signing.'
    doLast {
        def missing = cloudTestSecretNames.findAll { !cloudTestSecrets[it]?.trim() }
        if (!missing.isEmpty()) {
            throw new GradleException('Cloud Test signing secrets are missing: ' + missing.join(', ')
                    + '. Configure all four GitHub Actions repository secrets. Debug-key fallback is disabled.')
        }
        if (!cloudTestKeystorePath || !file(cloudTestKeystorePath).isFile()) {
            throw new GradleException('Cloud Test keystore file is missing. Decode CLOUD_TEST_KEYSTORE into a temporary file '
                    + 'and pass its path with -PcloudTestKeystorePath=/path/to/keystore.')
        }
        byte[] expected
        try {
            expected = Base64.decoder.decode(cloudTestSecrets.CLOUD_TEST_KEYSTORE.replaceAll('\\s', ''))
        } catch (IllegalArgumentException ignored) {
            throw new GradleException('CLOUD_TEST_KEYSTORE must contain valid base64-encoded keystore contents.')
        }
        if (expected.length == 0 || !Arrays.equals(expected, file(cloudTestKeystorePath).bytes)) {
            throw new GradleException('The temporary Cloud Test keystore does not match CLOUD_TEST_KEYSTORE. '
                    + 'Decode the configured secret again; no alternate signing key is allowed.')
        }
    }
}

// Scope validation to Cloud Test so debug/release and unrelated tasks need no secrets.
tasks.matching { it.name in ['preCloudTestBuild', 'validateSigningCloudTest'] }.configureEach {
    dependsOn validateCloudTestSigningSecrets
}

android {
    namespace 'com.shatteredpixel.shatteredpixeldungeon.android'
    compileSdk appAndroidCompileSDK
    compileOptions.sourceCompatibility = compileOptions.targetCompatibility = appJavaCompatibility

    sourceSets.main.assets.srcDirs = [new File(project(':core').projectDir, "/src/main/assets")]

    androidResources {
        localeFilters += ['en', 'zh-rCN', 'ko', 'ru', 'es', 'pt', 'fr', 'de', 'zh-rTW', 'ja', 'pl',
                          'it', 'tr', 'vi', 'uk', 'id', 'cs', 'nl', 'sv', 'hu', 'fi', 'el', 'be', 'eo' ]
    }

    defaultConfig {
        manifestPlaceholders = [appName:appName]
        applicationId appPackageName

        versionCode appVersionCode
        versionName appVersionName

        minSdkVersion appAndroidMinSDK
        targetSdkVersion appAndroidTargetSDK
    }

    signingConfigs {
        cloudTest {
            if (cloudTestKeystorePath) storeFile file(cloudTestKeystorePath)
            storePassword cloudTestSecrets.CLOUD_TEST_STORE_PASSWORD
            keyAlias cloudTestSecrets.CLOUD_TEST_KEY_ALIAS
            keyPassword cloudTestSecrets.CLOUD_TEST_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".indev"
            versionNameSuffix '-INDEV'
            dependencies {
                debugImplementation project(':services:updates:debugUpdates')
                debugImplementation project(':services:news:debugNews')
            }
        }
        cloudTest {
            initWith debug
            signingConfig signingConfigs.cloudTest
            applicationIdSuffix ".cloudtest"
            versionNameSuffix '-INDEV-CLOUDTEST'
            manifestPlaceholders = [appName: 'Nikke Pixel Dungeon Cloud Test']
            matchingFallbacks = ['debug']
        }
        release {

            //These lines enable R8, which is a code shrinker/optimizer/obfuscator.
            //This makes release APKs smaller and more efficient, but also makes debugging trickier
            //as the information produced in stack traces must be de-obfuscated.
            //See here: https://developer.android.com/studio/build/shrink-code#decode-stack-trace
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            dependencies {
                releaseImplementation project(':services:updates:githubUpdates')
                releaseImplementation project(':services:news:shatteredNews')
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

configurations {
    natives
    // Build-type initialization does not inherit debug's dependency configuration.
    cloudTestImplementation.extendsFrom debugImplementation
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$gdxControllersVersion"
}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
task copyAndroidNatives() {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}